<!doctype html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="theme-color" content="#0b6b45">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আল খিদমাহ হিসাব</title>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f1;--sf:#fff;--tx:#14261c;--mu:#5b6b61;--pr:#0b6b45;--on:#fff;--ac:#b8861a;--bd:#d8e2da;--dn:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a14;--sf:#17261d;--tx:#e8f0ea;--mu:#9bb0a2;--pr:#3fbf88;--on:#06281a;--ac:#e0b445;--bd:#2a3d31;--dn:#ff8a80}}
:root[data-theme="dark"]{--bg:#0f1a14;--sf:#17261d;--tx:#e8f0ea;--mu:#9bb0a2;--pr:#3fbf88;--on:#06281a;--ac:#e0b445;--bd:#2a3d31;--dn:#ff8a80}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Tiro Bangla','Noto Sans Bengali',serif;font-size:16px;line-height:1.5;padding-bottom:78px}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:18px;margin:16px 0 8px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{display:block;font-size:22px;color:var(--pr)}.stat span,.mu{color:var(--mu);font-size:14px}
.big{border-left:5px solid var(--ac)}
label{display:block;font-size:14px;color:var(--mu);margin:8px 0 2px}
input,select,textarea{width:100%;box-sizing:border-box;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 14px;background:var(--pr);color:var(--on);cursor:pointer}
button.s{background:transparent;color:var(--pr);border:1px solid var(--pr)}button.d{background:transparent;color:var(--dn);border:1px solid var(--dn)}
button.sm{padding:6px 10px;font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.sp{justify-content:space-between}
.pill{font-size:13px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.ok{color:var(--pr);font-weight:600}.bad{color:var(--dn);font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:12px 2px;font-size:14px}
nav button.on{color:var(--pr);box-shadow:inset 0 3px 0 var(--pr)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head><body><main id="app"></main>
<nav id="nav"></nav>
<script>
var S={members:[],products:[],orders:[],pays:[],rec:[]},tab='home',form=false,armed=null,q='',fs='',mon=new Date().toISOString().slice(0,7),KEY='akn_hisab_v1';
try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
S.rec=S.rec||[];S.exp=S.exp||[];var ok=!S.pin;
window.alert=function(m){var t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;left:12px;right:12px;bottom:80px;background:#14261c;color:#fff;padding:12px;border-radius:8px;z-index:9';document.body.appendChild(t);setTimeout(function(){t.remove()},3500)};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function h(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function bn(n){return Number(n).toLocaleString('bn-BD')}
function tk(n){return '৳'+bn(Math.round(n))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
var ST={new:'নতুন',sent:'কোম্পানিকে পাঠানো',done:'ডেলিভারি হয়েছে',ret:'ফেরত/বাতিল'};
function prof(o){return (o.price-o.cost)*o.qty}
function comm(o){return o.ctype==='percent'?o.price*o.qty*o.cval/100:o.cval*o.qty}
function co(){var t=0,r=0;S.orders.forEach(function(o){if(o.st==='done')t+=prof(o)+comm(o)});S.rec.forEach(function(x){r+=x.amt});return{t:t,r:r}}
function recv(){var v=+$('rc').value;if(!v)return;S.rec.push({id:id(),amt:v,date:new Date().toISOString().slice(0,10)});save();draw()}
function setCv(i){var v=+$('cv'+i).value||0;S.products.forEach(function(p){if(p.id===i)p.cval=v});S.orders.forEach(function(o){if(o.pid===i)o.cval=v});save();draw();alert('কমিশন বদলানো হয়েছে (এই পণ্যের সব অর্ডারে)')}
function setPin(){S.pin=$('pn2').value.trim();save();alert(S.pin?'পিন সেট হয়েছে':'পিন বন্ধ হয়েছে')}
function unlock(){if($('pi').value===S.pin){ok=true;draw()}else alert('ভুল পিন')}
function stmt(i){var m=mem(i),a=mine(i),t='হিসাব: '+m.name+'\n';S.orders.forEach(function(o){if(o.mid===i&&o.st==='done')t+=o.date+' '+o.pname+' ×'+o.qty+' লাভ '+prof(o)+'\n'});t+='মোট লাভ: '+a.p+'\nপরিশোধ: '+a.x+'\nবাকি: '+a.due;window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')}
function wn(p){p=String(p).replace(/\D/g,'');return p.slice(0,2)==='88'?p:'88'+p}
function addExp(){var a=+$('xa').value,w=$('xw').value.trim(),d=new Date().toISOString().slice(0,10);if(!a){alert('খরচের টাকা দিন।');return}if(d.slice(0,7)!==mon)d=mon+'-28';S.exp.push({id:id(),why:w||'খরচ',amt:a,date:d});save();draw()}
function rep(ym){var n=0,dn=0,s=0,p=0,c=0;S.orders.forEach(function(o){if(o.date.slice(0,7)!==ym)return;n++;if(o.st==='done'){dn++;s+=o.price*o.qty;p+=prof(o);c+=comm(o)}});var t='মাসের রিপোর্ট '+ym+'\nমোট অর্ডার: '+n+'\nডেলিভারি হয়েছে: '+dn+'\nমোট বিক্রি: '+s+' টাকা\nসদস্যদের লাভ: '+p+' টাকা\nআমার কমিশন: '+c+' টাকা';window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')}
function extra(ym,cm){var ex=0,el='',tp={},pd=0;
 S.exp.forEach(function(e){if(e.date.slice(0,7)===ym){ex+=e.amt;el+='<div class="mu">'+h(e.why)+' · '+tk(e.amt)+' '+dbtn('e'+e.id,'function(){S.exp=S.exp.filter(function(z){return z.id!==\''+e.id+'\'});save();draw()}')+'</div>'}});
 S.orders.forEach(function(o){if(o.st==='sent'&&Date.now()-new Date(o.date)>432e6)pd++;if(o.st==='done'&&o.date.slice(0,7)===ym)tp[o.mid]=(tp[o.mid]||0)+prof(o)});
 var top=Object.keys(tp).sort(function(a,b){return tp[b]-tp[a]}).slice(0,3).map(function(k,i){return '<div class="row sp"><span>'+bn(i+1)+'. '+h(mem(k).name)+'</span><b class="ok">'+tk(tp[k])+'</b></div>'}).join('');
 return (pd?'<div class="card"><b class="bad">'+bn(pd)+'টি অর্ডার ৫ দিনের বেশি “কোম্পানিকে পাঠানো” অবস্থায় আছে</b><div class="mu">কোম্পানির কাছে খোঁজ নিন।</div></div>':'')+'<div class="card big stat"><b>'+tk(cm-ex)+'</b><span>আমার নিট আয় (কমিশন − খরচ)</span><div class="row"><input id="xw" placeholder="খরচের কারণ" style="flex:2"><input id="xa" type="number" placeholder="টাকা" style="flex:1"><button class="sm" onclick="addExp()">খরচ</button></div>'+el+'</div>'+(top?'<div class="card"><b>এই মাসের সেরা সদস্য</b>'+top+'</div>':'')+'<div class="row"><button class="s" onclick="rep(\''+ym+'\')">মাসের রিপোর্ট হোয়াটসঅ্যাপে পাঠান</button></div>'}
function mem(i){return S.members.find(function(m){return m.id===i})||{name:'(মুছে ফেলা সদস্য)',phone:''}}
function mine(m){var p=0,x=0;S.orders.forEach(function(o){if(o.mid===m&&o.st==='done')p+=prof(o)});S.pays.forEach(function(y){if(y.mid===m)x+=y.amt});return{p:p,x:x,due:p-x}}
function go(t){tab=t;form=false;armed=null;draw()}
function arm(k,fn){if(armed===k){armed=null;fn()}else{armed=k;draw()}}
function dbtn(k,fn){return '<button class="d sm" onclick="arm(\''+k+'\','+fn+')">'+(armed===k?'নিশ্চিত? আবার চাপুন':'মুছুন')+'</button>'}
function home(){
 var ym=mon,n=0,dn=0,sale=0,mp=0,cm=0;
 S.orders.forEach(function(o){if(o.date.slice(0,7)!==ym)return;n++;if(o.st==='done'){dn++;sale+=o.price*o.qty;mp+=prof(o);cm+=comm(o)}});
 var due=0;S.members.forEach(function(m){due+=mine(m.id).due});
 var c=co();return '<h1>মাসের হিসাব</h1><input type="month" value="'+mon+'" onchange="mon=this.value||mon;draw()"><div class="grid" style="margin-top:10px"><div class="card stat"><b>'+bn(n)+'</b><span>মোট অর্ডার</span></div><div class="card stat"><b>'+bn(dn)+'</b><span>ডেলিভারি হয়েছে</span></div><div class="card stat"><b>'+tk(sale)+'</b><span>মোট বিক্রি</span></div><div class="card stat"><b>'+tk(mp)+'</b><span>সদস্যদের লাভ</span></div></div>'+
 '<div class="card big stat"><b>'+tk(cm)+'</b><span>আমার কমিশন (এই মাস)</span></div>'+
 '<div class="card big stat"><b>'+tk(mp+cm)+'</b><span>এই মাসে কোম্পানির কাছে পাওনা (সদস্যদের লাভ + আমার কমিশন)</span></div><div class="card big stat"><b>'+tk(c.t-c.r)+'</b><span>কোম্পানির কাছে মোট বাকি (সব সময়, এ পর্যন্ত পেয়েছেন '+tk(c.r)+')</span><div class="row"><input id="rc" type="number" placeholder="কোম্পানি কত দিল" style="flex:1"><button class="sm" onclick="recv()">পেয়েছি</button></div></div>'+
 '<div class="card big stat"><b>'+tk(due)+'</b><span>সদস্যদের এখনো দিতে হবে (সব সময়)</span></div>'+
 extra(ym,cm)+(S.members.length&&S.products.length?'':'<p class="mu">শুরু করতে আগে "সদস্য" ও "পণ্য" ট্যাবে তথ্য দিন।</p>');
}
function opt(a,f){return a.map(function(x){return '<option value="'+x.id+'">'+h(f(x))+'</option>'}).join('')}
function orders(){
 var f='';
 if(form){f='<div class="card"><label>সদস্য</label><select id="fm">'+opt(S.members,function(m){return m.name})+'</select><label>পণ্য</label><select id="fp" onchange="pick()">'+opt(S.products,function(p){return p.name})+'</select><label>সংখ্যা</label><input id="fq" type="number" min="1" value="1" oninput="hint()"><label>কাস্টমারের নাম</label><input id="fc"><label>ঠিকানা</label><textarea id="fa" rows="2"></textarea><label>কাস্টমারের মোবাইল</label><input id="fo" type="tel"><label>নোট (ঐচ্ছিক)</label><input id="fn"><label>প্রতি পিসের বিক্রয়মূল্য</label><input id="fv" type="number" oninput="hint()"><p id="ft" class="mu"></p><div class="row"><button onclick="addOrder()">অর্ডার সেভ করুন</button><button class="s" onclick="form=false;draw()">বাতিল</button></div></div>'}
 var l=S.orders.slice().reverse().filter(function(o){return (!fs||o.st===fs)&&(!q||(o.cname+o.cphone+o.pname+mem(o.mid).name).indexOf(q)>-1)}).map(function(o){var m=mem(o.mid);
  return '<div class="card"><div class="row sp"><b>'+h(o.cname)+'</b><span class="pill">'+bn(o.date.slice(8,10))+'/'+bn(o.date.slice(5,7))+'</span></div><div class="mu">'+h(o.pname)+' × '+bn(o.qty)+' · '+tk(o.price)+' পিস প্রতি</div><div class="mu">'+h(o.addr)+' · '+h(o.cphone)+'</div><div class="mu">সদস্য: '+h(m.name)+'</div>'+(o.note?'<div class="mu">নোট: '+h(o.note)+'</div>':'')+'<div class="row"><a href="tel:'+h(o.cphone)+'"><button class="s sm">কাস্টমারকে কল</button></a><a target="_blank" href="https://wa.me/'+wn(o.cphone)+'"><button class="s sm">কাস্টমারকে হোয়াটসঅ্যাপ</button></a></div><div class="row sp"><span>সদস্যের লাভ: <b class="ok">'+tk(prof(o))+'</b></span><span>আমার কমিশন: <b class="ok">'+tk(comm(o))+'</b></span></div>'+
  '<select onchange="setSt(\''+o.id+'\',this.value)">'+Object.keys(ST).map(function(k){return '<option value="'+k+'"'+(o.st===k?' selected':'')+'>'+ST[k]+'</option>'}).join('')+'</select><div class="row"><button class="s sm" onclick="wa(\''+o.id+'\')">কোম্পানিকে পাঠান (হোয়াটসঅ্যাপ)</button>'+dbtn('o'+o.id,'function(){delOrder(\''+o.id+'\')}')+'</div></div>'}).join('');
 return '<div class="row sp"><h1>অর্ডার</h1>'+(form?'':'<button onclick="openForm()">+ নতুন অর্ডার</button>')+'</div>'+f+(form?'':'<div class="row"><input placeholder="খুঁজুন: নাম/মোবাইল/পণ্য" value="'+h(q)+'" onchange="q=this.value.trim();draw()" style="flex:2"><select onchange="fs=this.value;draw()" style="flex:1"><option value="">সব</option>'+Object.keys(ST).map(function(k){return '<option value="'+k+'"'+(fs===k?' selected':'')+'>'+ST[k]+'</option>'}).join('')+'</select></div>')+(l||(form?'':'<p class="mu">এখনো কোনো অর্ডার নেই।</p>'));
}
function openForm(){if(!S.members.length||!S.products.length){alert('আগে অন্তত একজন সদস্য ও একটি পণ্য যোগ করুন।');return}form=true;draw();pick()}
function pick(){var p=S.products.find(function(x){return x.id===$('fp').value});if(p)$('fv').value=p.mrp;hint()}
function hint(){var p=S.products.find(function(x){return x.id===$('fp').value});if(!p)return;var v=+$('fv').value,q=+$('fq').value||1,t='সদস্যের লাভ: '+tk((v-p.cost)*q);if(v&&v<p.cost)t='⚠ দাম পাইকারি দামের ('+tk(p.cost)+') নিচে!';else if(v>p.mrp)t+=' · ⚠ দাম MRP ('+tk(p.mrp)+') এর বেশি';$('ft').textContent=t}
function addOrder(){var p=S.products.find(function(x){return x.id===$('fp').value}),v=+$('fv').value,c=$('fc').value.trim();
 if(!c||!$('fo').value.trim()||!v){alert('কাস্টমারের নাম, মোবাইল ও দাম দিন।');return}
 if(v<p.cost)alert('সতর্কতা: দাম পাইকারি দামের নিচে।');
 S.orders.push({id:id(),date:new Date().toISOString().slice(0,10),mid:$('fm').value,pid:p.id,pname:p.name,cost:p.cost,ctype:p.ctype,cval:p.cval,qty:+$('fq').value||1,cname:c,addr:$('fa').value.trim(),cphone:$('fo').value.trim(),note:$('fn').value.trim(),price:v,st:'new'});
 save();form=false;draw()}
function setSt(i,v){S.orders.find(function(o){return o.id===i}).st=v;save();draw()}
function delOrder(i){S.orders=S.orders.filter(function(o){return o.id!==i});save();draw()}
function wa(i){var o=S.orders.find(function(x){return x.id===i});var t='নতুন অর্ডার\nপণ্য: '+o.pname+' × '+o.qty+'\nনাম: '+o.cname+'\nঠিকানা: '+o.addr+'\nমোবাইল: '+o.cphone+'\nমোট দাম: '+(o.price*o.qty)+' টাকা';window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')}
function members(){
 var l=S.members.map(function(m){var a=mine(m.id);return '<div class="card"><div class="row sp"><b>'+h(m.name)+'</b>'+(m.off?' <span class="bad">· স্থগিত</span>':'')+'<span class="mu">'+h(m.phone)+'</span></div><div class="mu">মোট লাভ '+tk(a.p)+' · দেওয়া হয়েছে '+tk(a.x)+' · অর্ডার '+bn(S.orders.filter(function(o){return o.mid===m.id}).length)+'টি</div><div class="row"><a href="tel:'+h(m.phone)+'"><button class="s sm">কল</button></a><button class="s sm" onclick="togMem(\''+m.id+'\')">'+(m.off?'সক্রিয় করুন':'স্থগিত করুন')+'</button>'+dbtn('m'+m.id,'function(){S.members=S.members.filter(function(x){return x.id!==\''+m.id+'\'});save();draw()}')+'</div></div>'}).join('');
 return '<h1>সদস্য</h1><div class="card"><label>নাম</label><input id="mn"><label>মোবাইল নাম্বার</label><input id="mp" type="tel"><div class="row"><button onclick="addMem()">সদস্য যোগ করুন</button></div></div>'+(l||'<p class="mu">এখনো কোনো সদস্য নেই।</p>');
}
function addMem(){var n=$('mn').value.trim();if(!n){alert('নাম দিন।');return}S.members.push({id:id(),name:n,phone:$('mp').value.trim()});save();draw()}
function products(){
 var l=S.products.map(function(p){return '<div class="card"><b>'+h(p.name)+'</b><div class="mu">পাইকারি '+tk(p.cost)+' · MRP '+tk(p.mrp)+'</div><div class="mu">আমার কমিশন: '+(p.ctype==='percent'?bn(p.cval)+'%':tk(p.cval)+' প্রতি পিসে')+'</div><div class="row"><input id="cv'+p.id+'" type="number" value="'+p.cval+'" style="flex:1"><button class="s sm" onclick="setCv(\''+p.id+'\')">কমিশন বদলান</button>'+dbtn('p'+p.id,'function(){S.products=S.products.filter(function(x){return x.id!==\''+p.id+'\'});save();draw()}')+'</div></div>'}).join('');
